name: Compilar

# Verifica que el proyecto compile en cada push y en cada pull request.
# Si el check sale en verde, tu codigo compila: es el primer requisito
# de la tarea. Si sale en rojo, abre el log y revisa el error de compilacion.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar con Maven
        run: mvn -B compile
